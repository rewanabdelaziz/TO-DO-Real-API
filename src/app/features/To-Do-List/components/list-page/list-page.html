<div class="container-fluid min-vh-100 bg-light">
    <div class="container bg-light ">
        <div class="row mt-4 justify-content-center align-items-center min-vh-100" style="height: 500px;">
            <div class="col-md-6 bg-white shadow">

                <!-- Header / Card Title -->
                <div class="card bg-warning mt-4">
                    <h4 class="text-white ps-3 pt-2 pb-2">To Do List</h4>
                </div>

                <!-- Input Component -->
                <app-task-input></app-task-input>

                <!-- List Component -->
                <app-task-list 
                    (edit)="setTaskToEdit($event)" >
                </app-task-list>

                <!-- Edit Modal Component -->
                <app-task-edit-modal 
                    [selectedTask]="currentEditTask()" >
                </app-task-edit-modal>

            </div>
            
        </div>
    </div>
</div>
